name: Deploy to WeChat Prod

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'app.css'
      - 'app.scss'
      - '.github/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build (weapp)
        run: pnpm build:weapp

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write .env.production
        run: |
          echo "TARO_APP_SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}" > .env.production
          echo "TARO_APP_SUPABASE_ANON_KEY=${{ secrets.PROD_SUPABASE_ANON_KEY }}" >> .env.production
          # 境内反代入口（可选）：secret 没配就是空值 ⇒ 单入口，行为与从前一致
          echo "TARO_APP_SUPABASE_PROXY_URL=${{ secrets.PROD_SUPABASE_PROXY_URL }}" >> .env.production

      - name: Set release version
        run: pnpm version:release

      - name: Build for WeChat
        run: pnpm build:weapp

      - name: Upload to WeChat
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_PRIVATE_KEY: ${{ secrets.WX_PRIVATE_KEY }}
          # robot 2 固定给正式版；开发版用 robot 1（见 deploy-dev.yml）。
          # 微信把每个 robot 当作开发版列表里的独立上传位置，不同 robot 互不覆盖——
          # 否则两边 CI 会互相顶掉（ci.upload 没有版本类型参数）。
          WX_UPLOAD_ROBOT: 2
        run: |
          mkdir -p key
          echo "$WX_PRIVATE_KEY" > key/private.key
          node scripts/upload.js

      - name: Commit version back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          VERSION=$(node -e "console.log(require('./package.json').version)")
          git diff --cached --quiet || git commit -m "chore: release $VERSION [skip ci]"
          git push
          # 推送 tag 到远程。
          # ⚠️ 必须先查**远程**是否已有：同一个版本号部署两次是常见情形（改了 CI 配置
          # 后再推一次 main、或补跑发布），此时本地建 tag 会成功，但 push 会被拒绝，
          # 在 `-e` 下让整个 release job 挂掉——而代码其实早已上传成功，失败点纯属尾部噪音。
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "✓ 远程已有 tag v$VERSION，跳过"
          else
            git tag "v$VERSION" 2>/dev/null || true
            git push origin "v$VERSION"
            echo "✓ 已创建并推送 tag: v$VERSION"
          fi
