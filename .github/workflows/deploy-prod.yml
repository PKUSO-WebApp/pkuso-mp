name: Deploy to WeChat Prod

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'config/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'app.css'
      - 'app.scss'
      - '.github/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 闸门的唯一定义在 `scripts/gate.mjs`（AGENTS.md §1.2）。这里原先把四步**内联**，
      # 于是「改闸门」与「改 CI」是两件事，而文档写的是「CI 与人都调它」。
      # 现在 CI 与人调的是同一条命令。
      #
      # ⚠️ 闸门最后一步 `build:weapp`（NODE_ENV=production）读 `.env.production`，
      # 而 `.env.*` 是 gitignored 的 ⇒ CI 上必须自己写出来，否则构建拿不到 env。
      # **这次构建的产物不发布**（发布在下面的 release job，它会重写这份文件），
      # 所以占位值不会外流；有 secret 时用 secret，只是让这一步尽量贴近真实构建。
      - name: Write .env.production
        env:
          SUPA_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPA_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
        run: |
          echo "TARO_APP_SUPABASE_URL=${SUPA_URL:-https://placeholder.supabase.co}" > .env.production
          echo "TARO_APP_SUPABASE_ANON_KEY=${SUPA_KEY:-placeholder-key}" >> .env.production

      - name: 闸门（定义在 scripts/gate.mjs）
        run: pnpm gate:ci

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 不把 GITHUB_TOKEN 的凭据留在 .git/config 里：它推不进 main，
          # 留着反而会和下面用的 PAT 抢（见「Commit version back」的说明）。
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write .env.production
        run: |
          echo "TARO_APP_SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}" > .env.production
          echo "TARO_APP_SUPABASE_ANON_KEY=${{ secrets.PROD_SUPABASE_ANON_KEY }}" >> .env.production
          # 境内反代入口（可选）：secret 没配就是空值 ⇒ 单入口，行为与从前一致
          echo "TARO_APP_SUPABASE_PROXY_URL=${{ secrets.PROD_SUPABASE_PROXY_URL }}" >> .env.production

      - name: Set release version
        run: pnpm version:release

      - name: Build for WeChat
        run: pnpm build:weapp

      - name: Upload to WeChat
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_PRIVATE_KEY: ${{ secrets.WX_PRIVATE_KEY }}
          # robot 2 固定给正式版；开发版用 robot 1（见 deploy-dev.yml）。
          # 微信把每个 robot 当作开发版列表里的独立上传位置，不同 robot 互不覆盖——
          # 否则两边 CI 会互相顶掉（ci.upload 没有版本类型参数）。
          WX_UPLOAD_ROBOT: 2
        run: |
          mkdir -p key
          echo "$WX_PRIVATE_KEY" > key/private.key
          node scripts/upload.js

      - name: Commit version back
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          VERSION=$(node -e "console.log(require('./package.json').version)")
          git diff --cached --quiet || git commit -m "chore: release $VERSION [skip ci]"

          # ⚠️ 推 main 用 CROSS_REPO_TOKEN（PAT），**不是**默认的 GITHUB_TOKEN ——
          # 与 pkuso-backend 的「Commit updated types」是同款改动（backend 见 #86）。
          # main 的 ruleset 要求走 PR，其 bypass 名单只有 OrganizationAdmin 和一个
          # RepositoryRole，**没有 GitHub Actions**；用 GITHUB_TOKEN 推的身份正是它，
          # 会被 `GH013 … Changes must be made through a pull request` 拒掉。
          # 本仓的台账：版本总在发版 PR 里先 bump 好 ⇒ `version:release` 无 diff ⇒
          # 这一步实际很少推送，地雷一直没响；但合入带预发布后缀的版本时
          # （release 去掉后缀即产生 diff）推送就会发生——那天再修就晚了。
          # 配套：checkout 已设 persist-credentials: false（留着的 GITHUB_TOKEN
          # 凭据推不进 main，只会和 PAT 抢）。
          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push "$REMOTE_URL" "HEAD:${GITHUB_REF_NAME}"

          # 推送 tag 到远程。
          # ⚠️ 必须先查**远程**是否已有：同一个版本号部署两次是常见情形（改了 CI 配置
          # 后再推一次 main、或补跑发布），此时本地建 tag 会成功，但 push 会被拒绝，
          # 在 `-e` 下让整个 release job 挂掉——而代码其实早已上传成功，失败点纯属尾部噪音。
          if git ls-remote --tags "$REMOTE_URL" "refs/tags/v$VERSION" | grep -q .; then
            echo "✓ 远程已有 tag v$VERSION，跳过"
          else
            git tag "v$VERSION" 2>/dev/null || true
            git push "$REMOTE_URL" "refs/tags/v$VERSION"
            echo "✓ 已创建并推送 tag: v$VERSION"
          fi
