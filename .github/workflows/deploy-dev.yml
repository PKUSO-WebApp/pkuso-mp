name: CI Verify & Build

on:
  push:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --shamefully-hoist

      - name: Run checks
        run: |
          pnpm lint
          pnpm test

      - name: Build for WeChat
        run: pnpm build:weapp

