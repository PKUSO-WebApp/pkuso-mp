name: Deploy to WeChat Dev

on:
  push:
    branches: [dev]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Run checks
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: Build for WeChat
        run: pnpm build:weapp

      - name: Upload to WeChat Dev
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_PRIVATE_KEY: ${{ secrets.WX_PRIVATE_KEY }}
        run: |
          mkdir -p key
          echo "$WX_PRIVATE_KEY" > key/private.key
          node scripts/upload.js
