name: Deploy to WeChat Dev

on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'config/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'app.css'
      - 'app.scss'
      - '.github/**'
  # 手动补一次 dev 构建。存在的理由是 push 触发的构建**可能被静默跳过**：GitHub 看到
  # 提交信息里有跳过标记就跳过这次 push 的全部 workflow，而 squash 合并会把 PR 里的每条
  # 提交标题整段带进正文——PR 里只要有一条带标记（类型同步那种），整个合并就没构建。
  # 实测：2026-10-11 的 #64（72039c0）就这么丢了一次，dev 包停在上一版。
  # 用途就一个：出了这种情况不用再伪造一个提交，直接
  #   gh workflow run deploy-dev.yml --ref dev
  #
  # 也可以手动出「伪 prod」包：用生产库构建当前 ref，上传到 robot 3。用于还没发版、
  # 但必须在生产数据上验收的修复（例如阅读器空白帧）；它不碰 robot 1/2，也不回写版本。
  #   gh workflow run deploy-dev.yml --ref dev -f target=pseudo-prod
  workflow_dispatch:
    inputs:
      target:
        description: '构建环境'
        type: choice
        options: [dev, pseudo-prod]
        default: dev

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 闸门的唯一定义在 `scripts/gate.mjs`（AGENTS.md §1.2）。这里原先把四步**内联**，
      # 于是「改闸门」与「改 CI」是两件事，而文档写的是「CI 与人都调它」——
      # 实测两者已经不同：内联副本是 build 在最前、且构建用 `NODE_ENV=development`，
      # 而 `gate:ci` 是 lint → typecheck → test → build（生产环境），顺序与集合都不同。
      # 现在 CI 与人调的是同一条命令。
      #
      # ⚠️ 闸门最后一步 `build:weapp`（NODE_ENV=production）读 `.env.production`，
      # 而 `.env.*` 是 gitignored 的 ⇒ CI 上必须自己写出来，否则构建拿不到 env。
      # **这次构建的产物不发布**（发布在下面的 release job，它写自己的 `.env.development`），
      # 所以占位值不会外流；有 secret 时用 secret，只是让这一步尽量贴近真实构建。
      - name: Write .env.production
        env:
          SUPA_URL: ${{ secrets.DEV_SUPABASE_URL }}
          SUPA_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
        run: |
          echo "TARO_APP_SUPABASE_URL=${SUPA_URL:-https://placeholder.supabase.co}" > .env.production
          echo "TARO_APP_SUPABASE_ANON_KEY=${SUPA_KEY:-placeholder-key}" >> .env.production

      - name: 闸门（定义在 scripts/gate.mjs）
        run: pnpm gate:ci

  dev-release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write .env.development
        if: ${{ github.event.inputs.target != 'pseudo-prod' }}
        run: |
          echo "TARO_APP_SUPABASE_URL=${{ secrets.DEV_SUPABASE_URL }}" > .env.development
          echo "TARO_APP_SUPABASE_ANON_KEY=${{ secrets.DEV_SUPABASE_ANON_KEY }}" >> .env.development
          # 境内反代入口（可选）：secret 没配就是空值 ⇒ 单入口，行为与从前一致
          echo "TARO_APP_SUPABASE_PROXY_URL=${{ secrets.DEV_SUPABASE_PROXY_URL }}" >> .env.development

      # 伪 prod：与 deploy-prod.yml 同一个生产环境，只换上传槽位（robot 3），
      # 不触发版本回写 / tag。闸门已经用开发库的 .env.production 验过一次构建，
      # 这里再按生产环境出最终包。
      - name: Write .env.production (pseudo-prod)
        if: ${{ github.event.inputs.target == 'pseudo-prod' }}
        run: |
          echo "TARO_APP_SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}" > .env.production
          echo "TARO_APP_SUPABASE_ANON_KEY=${{ secrets.PROD_SUPABASE_ANON_KEY }}" >> .env.production
          echo "TARO_APP_SUPABASE_PROXY_URL=${{ secrets.PROD_SUPABASE_PROXY_URL }}" >> .env.production

      - name: Set dev version
        run: DEV_VERSION_NUM=${{ github.run_number }} pnpm version:dev

      - name: Build for WeChat
        run: |
          if [ "${{ github.event.inputs.target }}" = "pseudo-prod" ]; then
            NODE_ENV=production pnpm build:weapp
          else
            NODE_ENV=development pnpm build:weapp
          fi

      - name: Upload to WeChat Dev
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_PRIVATE_KEY: ${{ secrets.WX_PRIVATE_KEY }}
          # robot 1 固定给开发版；robot 2 给正式版（见 deploy-prod.yml）；
          # robot 3 给「伪 prod」验收包。微信把每个 robot 当作开发版列表里的独立
          # 上传位置，不同 robot 互不覆盖。
          WX_UPLOAD_ROBOT: ${{ github.event.inputs.target == 'pseudo-prod' && '3' || '1' }}
          WX_UPLOAD_DESC: ${{ github.event.inputs.target == 'pseudo-prod' && '伪prod（生产库）· 只用于真机验收' || '' }}
        run: |
          mkdir -p key
          echo "$WX_PRIVATE_KEY" > key/private.key
          node scripts/upload.js
