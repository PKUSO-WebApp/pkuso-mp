name: Deploy to WeChat Dev

on:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'config/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.npmrc'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'app.css'
      - 'app.scss'
      - '.github/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build (weapp)
        run: NODE_ENV=development pnpm build:weapp

  dev-release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write .env.development
        run: |
          echo "TARO_APP_SUPABASE_URL=${{ secrets.DEV_SUPABASE_URL }}" > .env.development
          echo "TARO_APP_SUPABASE_ANON_KEY=${{ secrets.DEV_SUPABASE_ANON_KEY }}" >> .env.development

      - name: Set dev version
        run: DEV_VERSION_NUM=${{ github.run_number }} pnpm version:dev

      - name: Build for WeChat
        run: NODE_ENV=development pnpm build:weapp

      - name: Upload to WeChat Dev
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_PRIVATE_KEY: ${{ secrets.WX_PRIVATE_KEY }}
          # robot 1 固定给开发版；正式版用 robot 2（见 deploy-prod.yml）。
          # 微信把每个 robot 当作开发版列表里的独立上传位置，不同 robot 互不覆盖。
          WX_UPLOAD_ROBOT: 1
        run: |
          mkdir -p key
          echo "$WX_PRIVATE_KEY" > key/private.key
          node scripts/upload.js
