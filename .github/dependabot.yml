# Dependabot 配置
#
# 背景（2026-09-29 审计）：三个仓库此前都没有这个文件。mp 的症状是**锁文件滞后** ——
# `pnpm-lock.yaml` 已 22 天未动，而同期代码提交了 193 次。没有自动提醒，依赖只会在
# 真出问题时才被发现。
#
# ⚠️ 本仓库 CI **不监听 pull_request**（只监听 push 到 dev/main），所以 Dependabot 开的 PR
#    **不会跑任何检查**。合之前请自己先在本地跑 `pnpm gate`。
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      # 本仓库由 husky + commitlint 强制 Conventional Commits
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # 下面三条都是**有意留在低版本**的。写在这里而不是靠人每周拒绝一次 ——
      # 靠人记着拒绝，迟早会漏，而漏一次的代价是构建/类型直接坏。
      #
      # 判据统一是 `pnpm check-dependabot`（scripts/check-dependabot.mjs）：
      # 它拿每个 PR 的分支建 worktree、真跑一遍闸门。解除任何一条之前先跑它。
      #
      # ── webpack ──────────────────────────────────────────────
      # 精确锁定的直接依赖。5.111 与 Taro 的进度插件不兼容：
      #   ValidationError: Progress Plugin ... unknown property 'name' / 'color' / 'reporters'
      # 小程序构建直接挂。实测 2026-09-29，且因为本仓库 CI 不跑 PR，它一路合进 main
      # 才在 `Deploy to WeChat Prod` 上暴露（已钉回 5.91.0）。
      - dependency-name: "webpack"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

      # ── typescript ───────────────────────────────────────────
      # 5.4.5 → 7.0.2 在 lint 阶段就挂（typescript-eslint 生态尚未跟上 TS 7）。
      # 本仓库只在 `tsc --noEmit` 里用 TS，实际转译交给 Taro/webpack，
      # 所以停在 5.x 没有任何代价。
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

      # ── @types/node ──────────────────────────────────────────
      # 18 → 26 后 typecheck 报：
      #   src/lib/error-report.test.ts(429,24): error TS2550: Property 'at' does not
      #   exist on type 'Record<string, unknown>[][]'. Do you need to change your
      #   target library?
      #
      # 根因**不在 @types/node**：`tsconfig.json` 是 `"target": "es2017"` 且没有 `lib`，
      # 而 `.at()` 属于 ES2022 —— 现在能用，是因为 @types/node 18 自带了那层声明；
      # 26 不再补，于是这个早就存在的配置问题暴露出来。
      #
      # 更干净的修法是把 tsconfig 的 `lib` 抬到 `["ES2022"]`（emit 由 Taro 负责，
      # 所以只影响类型检查），然后这条就能解除。**待定，先钉住。**
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

      # ── vitest ───────────────────────────────────────────────
      # ⚠️ 这一条与上面三条**不同**：它 `pnpm check-dependabot` 是**过的**（4.1.11 → 5.0.2
      # 能过 lint/typecheck/test/build）。留低版本是**有意的保守**，不是因为它坏。
      #
      # 理由：闸门只能验「跑得通」，验不了「测出来的东西还对」。测试框架跨大版本恰恰是
      # 那一类 —— 断言可能变得更宽松、或默认行为变化而测试照绿，**这种退化闸门看不见**。
      # 要升的时候请单独做一轮，并确认关键用例仍然会在该红的时候红。
      - dependency-name: "vitest"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci(deps)"
