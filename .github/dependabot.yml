# Dependabot 配置
#
# 背景（2026-09-29 审计）：三个仓库此前都没有这个文件。mp 的症状是**锁文件滞后** ——
# `pnpm-lock.yaml` 已 22 天未动，而同期代码提交了 193 次。没有自动提醒，依赖只会在
# 真出问题时才被发现。
#
# ⚠️ 本仓库 CI **不监听 pull_request**（只监听 push 到 dev/main），所以 Dependabot 开的 PR
#    **不会跑任何检查**。合之前请自己先在本地跑 `pnpm gate`。
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      # 本仓库由 husky + commitlint 强制 Conventional Commits
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # webpack 是**精确锁定**的直接依赖，而 Taro 的进度插件与 5.111 的 schema 不兼容：
      #   ValidationError: Progress Plugin ... unknown property 'name' / 'color' / 'reporters'
      # 结果是小程序构建直接挂 —— 实测 2026-09-29，且因为本仓库 CI 不跑 PR，
      # 它一路合进了 main 才在 `Deploy to WeChat Prod` 上暴露。
      #
      # 只挡 minor 与 major：patch 仍然收（风险低），等 Taro 侧跟上了再解除。
      # 解除前请先本地跑 `pnpm gate` 确认构建能过。
      - dependency-name: "webpack"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci(deps)"
